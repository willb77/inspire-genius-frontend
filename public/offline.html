<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inspire Genius — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #002060;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .container { max-width: 420px; }
      .icon {
        width: 96px;
        height: 96px;
        margin: 0 auto 1.5rem;
        border-radius: 20px;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
      p { font-size: 1rem; opacity: 0.8; line-height: 1.5; margin-bottom: 1.5rem; }
      button {
        background: #ffffff;
        color: #002060;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/icons/icon-96x96.png" alt="Inspire Genius" class="icon" />
      <h1>You're Offline</h1>
      <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
