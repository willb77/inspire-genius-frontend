# Stops the project log being republished to the public web.
#
# FE #453 removed IG_project_log.html and change_log.md from this repo. They had
# been served at https://<host>/IG_project_log.html — HTTP 200, 2.7 MB, to anyone
# with the link — because Vite copies public/ verbatim into dist/ and CI syncs
# dist/ to the S3 bucket behind CloudFront. Redaction reduced what leaked; it did
# not stop it being public.
#
# Removing the files did not remove the danger. At the time of writing, five open
# PRs plus several feature branches still carried them, and the monorepo's
# scripts/sync_project_log.py still regenerates them into this working tree. Any
# one of those merging puts the log back on the public internet with no error, no
# failing test, and nothing to notice.
#
# So this is the backstop: it is not enough to delete the file once, something has
# to refuse to accept it back.
name: No published logs

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  guard:
    name: Guard — project log must not be republished
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a project-log file is present
        run: |
          # Tracked files only — a local, uncommitted copy is a working-tree
          # concern, not something that can reach CloudFront.
          # git pathspec: a leading '*' matches across directory separators,
          # so these catch the file at the repo root or nested anywhere.
          FOUND=$(git ls-files -- \
            '*IG_project_log.html' \
            '*change_log.md')

          if [ -n "$FOUND" ]; then
            echo "::error title=Project log must not be republished::These files are served publicly from this repo and were removed in #453."
            echo ""
            echo "The following tracked file(s) would republish the project log:"
            echo "$FOUND" | sed 's/^/  - /'
            echo ""
            echo "This repo is PUBLIC, and public/ is copied verbatim into dist/ and"
            echo "deployed to CloudFront, so committing any of these serves the whole"
            echo "project log at https://<host>/IG_project_log.html to anyone."
            echo ""
            echo "To fix:  git rm --cached <path> && git commit"
            echo ""
            echo "If you got these from the monorepo's scripts/sync_project_log.py,"
            echo "that script's mirror targets are retired — do not commit its output."
            exit 1
          fi

          echo "OK — no project-log files tracked in this repo."
