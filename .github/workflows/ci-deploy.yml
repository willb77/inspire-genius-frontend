name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

env:
  NODE_VERSION: "20"
  S3_BUCKET: inspires-genius-dev-frontend
  CLOUDFRONT_DISTRIBUTION_ID: EQNFTOWMBMKSA
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────
  # 1. BUILD
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Generate .env
        run: |
          echo "VITE_NODE_ENV=production" > .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_ALEX_WEBSOCKET_URL=${{ secrets.VITE_ALEX_WEBSOCKET_URL }}" >> .env
          echo "VITE_AGENTS_WEBSOCKET_BASE_URL=${{ secrets.VITE_AGENTS_WEBSOCKET_BASE_URL }}" >> .env
          echo "VITE_STORAGE_SECRET=${{ secrets.VITE_STORAGE_SECRET }}" >> .env
          echo "VITE_MAGIC_AUTH_URL=${{ secrets.VITE_MAGIC_AUTH_URL }}" >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}" >> .env
          echo "VITE_AGENT_ENGINE_URL=${{ secrets.VITE_AGENT_ENGINE_URL }}" >> .env
          echo "VITE_SENTRY_ENVIRONMENT=production" >> .env
          echo "VITE_APP_VERSION=${{ github.sha }}" >> .env

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # 2. UNIT & INTEGRATION TESTS (with coverage)
  # ─────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests with coverage (60% threshold)
        run: |
          npx jest --ci --forceExit --coverage \
            --coverageThreshold='{"global":{"branches":55,"functions":60,"lines":60,"statements":60}}'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. DEPENDENCY AUDIT (frontend)
  # ─────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. TRIVY FILESYSTEM SCAN
  # ─────────────────────────────────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"

      - name: Run Trivy (JSON report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "json"
          output: "trivy-report.json"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # 5. E2E SMOKE TESTS (per role)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E — ${{ matrix.role }}
    needs: build
    runs-on: ubuntu-latest
    if: false  # Disabled — route mocking needs further debugging
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        role: [user, manager, company-admin, practitioner, distributor, super-admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npx vite preview --port 4173 &

      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            curl -s http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "Server failed to start" && exit 1

      - name: Run E2E tests — @${{ matrix.role }}
        env:
          CI: "true"
          BASE_URL: http://localhost:4173
        run: npx playwright test --project=chromium --grep="@${{ matrix.role }}"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.role }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 6. DEPLOY TO STAGING (requires approval)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [build, test-unit, dependency-audit, trivy-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.inspiregenius.com

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to S3 (staging)
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Staging deployment complete
        run: echo "Deployed to staging — https://d1nxsns258du4y.cloudfront.net"

  # ─────────────────────────────────────────────
  # 7. DEPLOY TO PRODUCTION (requires approval)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment:
      name: production
      url: https://app.inspiregenius.com

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to S3 (production)
        run: aws s3 sync dist/ s3://${{ secrets.PROD_S3_BUCKET || env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID || env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Production deployment complete
        run: echo "Deployed to production — https://app.inspiregenius.com"
