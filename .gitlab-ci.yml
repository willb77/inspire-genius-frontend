stages:
  - build
  - sonar
  - deploy

# =========================
# BUILD STAGE (DEV + UAT)
# =========================
devBuild:
  stage: build
  image: node:20.19.0
  tags:
    - 3pp-sandbox

  rules:
    - if: '$CI_COMMIT_REF_NAME == "development"'
    - if: '$CI_COMMIT_REF_NAME == "uat"'
    - when: never

  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

  script:

    # Generate .env (build-time config)
    - echo "VITE_NODE_ENV=production" > .env
    - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env
    - echo "VITE_ALEX_WEBSOCKET_URL=$VITE_ALEX_WEBSOCKET_URL" >> .env
    - echo "VITE_STORAGE_SECRET=$VITE_STORAGE_SECRET" >> .env

    # Install & build
    - npm ci --no-audit --no-fund
    - npm run build

  artifacts:
    paths:
      - dist/
    expire_in: 1 day


# =========================
# SONARQUBE (DEV ONLY)
# =========================
sonarqube:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:5
  tags:
    - 3pp-sandbox
  dependencies:
    - devBuild

  rules:
    - if: '$CI_COMMIT_REF_NAME == "development"'
      when: on_success
    - when: never

  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"

  script:
    - echo "Running SonarQube analysis for DEV..."
    - sonar-scanner \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.projectName=$SONAR_PROJECT_NAME \
        -Dsonar.sources=. \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN

  allow_failure: true   # DEV should not be blocked


# =========================
# DEPLOY STAGE
# =========================
deploy:
  stage: deploy
  image: amazon/aws-cli:2.15.10
  tags:
    - 3pp-sandbox
  dependencies:
    - devBuild

  rules:
    # DEV → auto deploy
    - if: '$CI_COMMIT_REF_NAME == "development"'
      when: on_success

    # UAT → manual approval
    - if: '$CI_COMMIT_REF_NAME == "uat"'
      when: manual
      allow_failure: false

    - when: never

  script:
    # Select environment
    - |
      if [ "$CI_COMMIT_REF_NAME" = "uat" ]; then
        echo "UAT environment detected"
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_UAT"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_UAT"
        export S3_BUCKET_NAME="$S3_BUCKET_NAME_UAT"
        export CLOUDFRONT_DISTRIBUTION_ID="$CLOUDFRONT_DISTRIBUTION_ID_UAT"
      else
        echo "DEV environment detected"
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
        export S3_BUCKET_NAME="$S3_BUCKET_NAME"
        export CLOUDFRONT_DISTRIBUTION_ID="$CLOUDFRONT_DISTRIBUTION_ID"
      fi

    - export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"

    # Verify AWS identity
    - aws sts get-caller-identity

    # Deploy to S3 (safe sync)
    - echo "Deploying build to S3..."
    - aws s3 sync dist/ "s3://$S3_BUCKET_NAME" --delete

    # CloudFront invalidation
    - echo "Invalidating CloudFront cache..."
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

    - echo "Deployment complete!"
