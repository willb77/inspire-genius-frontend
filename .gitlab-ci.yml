stages:
  - build
  - deploy

# -------------------------
# Build Job
# -------------------------
devBuild:
  stage: build
  image: node:20.19.0   # ✅ Vite requires Node.js 20.19+ or 22.12+
  tags:
    - 3pp-sandbox
  only:
    - development
  script:
    # Create .env file dynamically from GitLab CI variables
    - |
      echo "VITE_NODE_ENV=production" > .env
      echo "VITE_SERVER_URL=$VITE_SERVER_URL" >> .env
      echo "VITE_ALEX_WEBSOCKET_URL=$VITE_ALEX_WEBSOCKET_URL" >> .env
    - cat .env

    # Install dependencies and build
    - npm ci
    - npm audit fix || true   # (optional) fix vulnerabilities, but don’t fail job
    - npm run build  

    # Debug: Verify WebSocket URL made it into build
    - echo "🔍 Verifying built WebSocket URLs..."
    - grep -r "pacewisdom" dist/ || echo " URL not found in build"
      
  artifacts:
    paths:
      - dist/

# -------------------------
# Deploy Job
# -------------------------
deploy:
  stage: deploy
  image: amazon/aws-cli:2.15.10
  tags:
    - 3pp-sandbox
  only:
    - development
  script:
    # Clean bucket before uploading new build
    - aws s3 rm s3://$S3_BUCKET_NAME/ --recursive
    
    # Upload new build
    - aws s3 cp dist/ s3://$S3_BUCKET_NAME/ --recursive

    # Invalidate CloudFront cache
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
  dependencies:
    - devBuild
