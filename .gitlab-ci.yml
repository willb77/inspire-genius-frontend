stages:
  - build
  - deploy

# -------------------------
# Build Job
# -------------------------
devBuild:
  stage: build
  tags:
    - 3pp-sandbox
  only:
    - development
  script:
    # Install Node.js 20 only for this job using NVM
    - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
    - export NVM_DIR="$HOME/.nvm"
    - source $NVM_DIR/nvm.sh
    - nvm install 20.19.0
    - nvm use 20.19.0
    - node -v
    - npm -v

    # Create .env file dynamically from GitLab CI variables
    - echo "VITE_NODE_ENV=production" > .env
    - echo "VITE_SERVER_URL=$VITE_SERVER_URL" >> .env
    - echo "VITE_ALEX_WEBSOCKET_URL=$VITE_ALEX_WEBSOCKET_URL" >> .env
    - cat .env

    # Install dependencies and build
    - npm ci
    - npm audit fix || true
    - npm run build  

    # Debug: Verify WebSocket URL made it into build
    - echo "🔍 Verifying built WebSocket URLs..."
    - grep -r "pacewisdom" dist/ || echo " URL not found in build"
      
  artifacts:
    paths:
      - dist/

# -------------------------
# Deploy Job
# -------------------------
deploy:
  stage: deploy
  image: amazon/aws-cli:2.15.10
  tags:
    - 3pp-sandbox
  only:
    - development
  dependencies:
    - devBuild
  script:
    # Ensure required AWS variables exist
    - '[ -z "$S3_BUCKET_NAME" ] && echo "Missing S3_BUCKET_NAME" && exit 1'
    - '[ -z "$CLOUDFRONT_DISTRIBUTION_ID" ] && echo "Missing CLOUDFRONT_DISTRIBUTION_ID" && exit 1'
    - '[ -z "$AWS_ACCESS_KEY_ID" ] && echo "Missing AWS_ACCESS_KEY_ID" && exit 1'
    - '[ -z "$AWS_SECRET_ACCESS_KEY" ] && echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1'
    - '[ -z "$AWS_DEFAULT_REGION" ] && echo "Missing AWS_DEFAULT_REGION" && exit 1'

    # Clean S3 bucket (trim spaces)
    - aws s3 rm "s3://$(echo $S3_BUCKET_NAME | xargs)" --recursive

    # Upload new build
    - aws s3 cp dist/ "s3://$(echo $S3_BUCKET_NAME | xargs)" --recursive

    # Invalidate CloudFront
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
